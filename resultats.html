<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevé de Notes - HADRI LAMYAE</title>
    <style>
        /* CSS MODERNE */
        :root {
            --valid: #27ae60; /* Vert */
            --rat: #e74c3c;   /* Rouge */
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Carte Profil */
        .profile-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-left: 5px solid #4a90e2;
        }

        .profile-info h1 { margin: 0; font-size: 1.5rem; color: var(--dark); }
        .profile-info p { margin: 5px 0 0; color: #7f8c8d; }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        /* Tableau des notes */
        .modules-grid {
            display: grid;
            gap: 15px;
        }

        .module-card {
            background: white;
            border-radius: 10px;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .module-card:hover { transform: translateY(-2px); }

        .module-info { flex: 1; }
        .module-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 4px; }
        .sub-elements { font-size: 0.85rem; color: #7f8c8d; font-style: italic; }

        .module-grade {
            text-align: right;
            min-width: 100px;
        }

        .note-value {
            font-size: 1.4rem;
            font-weight: bold;
            display: block;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
            color: white;
            display: inline-block;
            margin-top: 5px;
        }

        /* Couleurs dynamiques */
        .status-v { background-color: var(--valid); }
        .status-rat { background-color: var(--rat); }
        .text-v { color: var(--valid); }
        .text-rat { color: var(--rat); }

    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="profile-info">
                <h1>HADRI LAMYAE</h1>
                <p>Née le : <strong>22/05/2006</strong></p>
                <p>Filière : <strong>2ème Année préparatoire</strong></p>
                <p>Code Massar : R134599413</p>
            </div>
            <button onclick="logout()" class="logout-btn">Déconnexion</button>
        </div>

        <h3 style="color: var(--dark); margin-bottom: 15px;">Relevé de Notes</h3>
        <div class="modules-grid" id="modulesList">
            </div>
    </div>

    <script>
        // 1. Sécurité simple : Vérifier si l'utilisateur est connecté
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "index.html";
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            window.location.href = "index.html";
        }

        // 2. DONNÉES DE L'ÉTUDIANTE
        // Je calcule ici les moyennes composées pour l'affichage
        const modules = [
            { name: "Commerce et logistique", note: 16.25, details: "" },
            { 
                name: "TEC Français & Anglais", 
                note: (18 + 17.75) / 2, // Moyenne calculée par JS
                details: "Français: 18 | Anglais: 17.75" 
            },
            { 
                name: "Math Financière & DIF", 
                note: (14 + 16) / 2, // Moyenne calculée par JS
                details: "Math Fin: 14 | DIF: 16" 
            },
            { name: "Economie Internationale", note: 17.75, details: "" },
            { name: "Droit des Affaires", note: 17.00, details: "" },
            { name: "Digital Skills", note: 18.50, details: "" },
            { name: "Comptabilité de gestion", note: 16.25, details: "" }
        ];

        // 3. GÉNÉRATION DE L'AFFICHAGE (Logique V / RAT)
        const container = document.getElementById('modulesList');

        modules.forEach(mod => {
            // Déterminer si Validé ou Rattrapage
            const isValid = mod.note >= 10;
            const statusText = isValid ? "VALIDÉ" : "RATTRAPAGE";
            const colorClass = isValid ? "status-v" : "status-rat";
            const textClass = isValid ? "text-v" : "text-rat";

            // Création du HTML pour chaque module
            const html = `
                <div class="module-card">
                    <div class="module-info">
                        <div class="module-title">${mod.name}</div>
                        ${mod.details ? `<div class="sub-elements">${mod.details}</div>` : ''}
                    </div>
                    <div class="module-grade">
                        <span class="note-value ${textClass}">${mod.note.toFixed(2)}/20</span>
                        <span class="status-badge ${colorClass}">${statusText}</span>
                    </div>
                </div>
            `;
            
            container.innerHTML += html;
        });
    </script>

</body>
</html>
